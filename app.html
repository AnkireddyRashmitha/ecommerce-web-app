<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Task Management App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#38bdf8;
}

.top{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

input,select{
    padding:10px;
    border:none;
    border-radius:8px;
    width:200px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0284c7;
}

.tasks{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
}

.card h3{
    margin-bottom:10px;
}

.status{
    margin-top:10px;
    font-size:14px;
    color:#94a3b8;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:10px;
}

.delete{
    background:red;
}

.done{
    background:green;
}
</style>

</head>
<body>

<div class="container">

<h1>TaskFlow App</h1>

<div class="top">
    <input type="text" id="title" placeholder="Task title">

    <select id="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
    </select>

    <button onclick="addTask()">Add Task</button>
</div>

<div class="tasks" id="taskContainer"></div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks(){
    localStorage.setItem("tasks",JSON.stringify(tasks));
}

function renderTasks(){

    let container = document.getElementById("taskContainer");

    container.innerHTML = "";

    tasks.forEach((task,index)=>{

        container.innerHTML += `
        
        <div class="card">

            <h3>${task.title}</h3>

            <div class="status">
                Status: ${task.status}
            </div>

            <div class="actions">

                <button class="done" onclick="markDone(${index})">
                    Done
                </button>

                <button class="delete" onclick="deleteTask(${index})">
                    Delete
                </button>

            </div>

        </div>

        `;
    });
}

function addTask(){

    let title = document.getElementById("title").value;

    let status = document.getElementById("status").value;

    if(title === ""){
        alert("Enter task title");
        return;
    }

    tasks.push({
        title:title,
        status:status
    });

    saveTasks();

    renderTasks();

    document.getElementById("title").value = "";
}

function deleteTask(index){

    tasks.splice(index,1);

    saveTasks();

    renderTasks();
}

function markDone(index){

    tasks[index].status = "Completed";

    saveTasks();

    renderTasks();
}

renderTasks();

</script>

</body>
</html>
